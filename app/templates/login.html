{% extends "base.html" %}

{% block title %}管理员登录 - 智能停车系统{% endblock %}

{% block login_content %}
<div class="login-body">
    <div class="card login-card shadow-lg border-0 rounded-lg">
        <div class="card-header bg-white border-0 text-center pt-4 pb-0">
             <div class="mb-3 text-primary">
                 <i class="fas fa-parking fa-3x"></i>
             </div>
             <h3 class="font-weight-light my-2">欢迎回来</h3>
             <p class="text-muted">智能停车管理系统 Pro</p>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="inputUser" placeholder="用户名" required>
                    <label for="inputUser">用户名</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" name="password" class="form-control" id="inputPassword" placeholder="密码" required>
                    <label for="inputPassword">密码</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="rememberCheck">
                    <label class="form-check-label" for="rememberCheck">
                        记住我
                    </label>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button class="btn btn-primary btn-lg" type="submit">登 录</button>
                </div>
            </form>
        </div>
        <div class="card-footer bg-white border-0 text-center py-3">
            <div class="small"><a href="#" class="text-muted">忘记密码? 请联系超级管理员</a></div>
        </div>
    </div>
</div>
{% endblock %}
